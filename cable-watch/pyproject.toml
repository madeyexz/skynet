[project]
name = "cable-watch"
version = "0.1.0"
description = "Watch ships over undersea cables with open AIS, cable-route and Sentinel-1 data"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "shapely>=2.0",
  "pyproj>=3.6",
  "numpy>=1.26",
]

[dependency-groups]
prep = ["pandas>=2.2", "pyshp>=2.3"]

[tool.uv]
package = false
